name: Linux Tauri system dependencies
description: >
  Installs the Debian/Ubuntu packages Tauri 2 needs to compile on Linux (WebKitGTK 4.1 etc.).
  Every job that builds crates/app on Linux (clippy and tests included) needs these.
runs:
  using: composite
  steps:
    - name: Install apt packages
      shell: bash
      # Ubuntu mirrors occasionally return 503/404 mid-download; retry instead of failing the job.
      run: |
        pkgs=(build-essential libayatana-appindicator3-dev librsvg2-dev libssl-dev
              libwebkit2gtk-4.1-dev libxdo-dev patchelf)
        for attempt in 1 2 3; do
          if sudo apt-get -o Acquire::Retries=5 update &&
             sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends --fix-missing "${pkgs[@]}"; then
            exit 0
          fi
          echo "apt attempt $attempt failed; retrying in $((attempt * 20))s" >&2
          sleep $((attempt * 20))
        done
        exit 1
