name: Set up UI toolchain
description: >
  Installs Node.js and pnpm, restores the pnpm store and runs `pnpm -C ui install --frozen-lockfile`.
  ui/ is a standalone pnpm project; ui/pnpm-workspace.yaml points storeDir at ../.dev/pnpm-store
  (pnpm 12 ignores store-dir from env/.npmrc), so that directory is what gets cached.
inputs:
  node-version:
    description: Node.js version (ui/ requires >= 20.19)
    default: "24"
  pnpm-version:
    description: pnpm version (must match the version the lockfile was written with)
    default: "12.16.1"
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        # Caching is done below with an explicit path; setup-node would look for a root lockfile.
        package-manager-cache: false

    - name: Set up pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Cache pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .dev/pnpm-store
        key: pnpm-store-${{ runner.os }}-${{ inputs.pnpm-version }}-${{ hashFiles('ui/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-${{ inputs.pnpm-version }}-

    - name: Install UI dependencies
      shell: bash
      run: pnpm -C ui install --frozen-lockfile
