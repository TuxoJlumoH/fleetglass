# Sample workloads for the fleetglass-dev kind cluster (applied by scripts/dev-cluster.sh up).
# They cover the status cases later tests need: Running, CrashLoopBackOff, Completed Job,
# Pending (unschedulable), ImagePullBackOff, plus a Service, ConfigMap and Secret.
# All objects carry app.kubernetes.io/part-of=fleetglass-samples. Images are small and public.
apiVersion: v1
kind: Namespace
metadata:
  name: fg-demo
  labels: {app.kubernetes.io/part-of: fleetglass-samples}
---
apiVersion: v1
kind: Namespace
metadata:
  name: fg-demo-2
  labels: {app.kubernetes.io/part-of: fleetglass-samples}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: fg-demo
  labels: {app.kubernetes.io/part-of: fleetglass-samples}
data:
  index.html: "<h1>fleetglass sample</h1>\n"
  LOG_LEVEL: debug
---
apiVersion: v1
kind: Secret
metadata:
  name: web-secret
  namespace: fg-demo
  labels: {app.kubernetes.io/part-of: fleetglass-samples}
type: Opaque
stringData:
  username: demo
  password: not-a-real-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: fg-demo
  labels: {app: web, app.kubernetes.io/part-of: fleetglass-samples}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web, app.kubernetes.io/part-of: fleetglass-samples}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80, name: http}]
          envFrom:
            - configMapRef: {name: web-config}
          env:
            - name: WEB_USER
              valueFrom: {secretKeyRef: {name: web-secret, key: username}}
          volumeMounts:
            - {name: html, mountPath: /usr/share/nginx/html}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: html
          configMap: {name: web-config, items: [{key: index.html, path: index.html}]}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: fg-demo
  labels: {app: web, app.kubernetes.io/part-of: fleetglass-samples}
spec:
  selector: {app: web}
  ports: [{name: http, port: 80, targetPort: http}]
---
# Exits 1 every start -> CrashLoopBackOff.
apiVersion: v1
kind: Pod
metadata:
  name: crashloop
  namespace: fg-demo
  labels: {app: crashloop, app.kubernetes.io/part-of: fleetglass-samples}
spec:
  restartPolicy: Always
  containers:
    - name: main
      image: busybox:1.36
      command: ["sh", "-c", "echo 'crashing on purpose'; sleep 2; exit 1"]
      resources:
        requests: {cpu: 5m, memory: 8Mi}
---
# Never schedulable -> Pending (Unschedulable).
apiVersion: v1
kind: Pod
metadata:
  name: pending
  namespace: fg-demo
  labels: {app: pending, app.kubernetes.io/part-of: fleetglass-samples}
spec:
  nodeSelector:
    fleetglass.dev/does-not-exist: "true"
  containers:
    - name: main
      image: busybox:1.36
      command: ["sleep", "infinity"]
---
# Tag that does not exist -> ErrImagePull / ImagePullBackOff.
apiVersion: v1
kind: Pod
metadata:
  name: bad-image
  namespace: fg-demo-2
  labels: {app: bad-image, app.kubernetes.io/part-of: fleetglass-samples}
spec:
  containers:
    - name: main
      image: busybox:0.0.0-fleetglass-does-not-exist
      command: ["sleep", "infinity"]
---
# Completes -> Completed pod, Job Complete.
apiVersion: batch/v1
kind: Job
metadata:
  name: hello
  namespace: fg-demo-2
  labels: {app.kubernetes.io/part-of: fleetglass-samples}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {app: hello, app.kubernetes.io/part-of: fleetglass-samples}
    spec:
      restartPolicy: Never
      containers:
        - name: main
          image: busybox:1.36
          command: ["sh", "-c", "echo hello from fleetglass; sleep 3"]
---
# Fails -> Error pod, Job Failed.
apiVersion: batch/v1
kind: Job
metadata:
  name: fails
  namespace: fg-demo-2
  labels: {app.kubernetes.io/part-of: fleetglass-samples}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {app: fails, app.kubernetes.io/part-of: fleetglass-samples}
    spec:
      restartPolicy: Never
      containers:
        - name: main
          image: busybox:1.36
          command: ["sh", "-c", "echo failing on purpose >&2; exit 3"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sleeper
  namespace: fg-demo-2
  labels: {app: sleeper, app.kubernetes.io/part-of: fleetglass-samples}
spec:
  replicas: 1
  selector:
    matchLabels: {app: sleeper}
  template:
    metadata:
      labels: {app: sleeper, app.kubernetes.io/part-of: fleetglass-samples}
    spec:
      containers:
        - name: main
          image: busybox:1.36
          command: ["sh", "-c", "i=0; while true; do echo tick $i; i=$((i+1)); sleep 5; done"]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
---
# Headless Service for the StatefulSet below.
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: fg-demo
  labels: {app: db, app.kubernetes.io/part-of: fleetglass-samples}
spec:
  clusterIP: None
  selector: {app: db}
  ports: [{name: tcp, port: 80, targetPort: 80}]
---
# StatefulSet with a volume claim template -> StatefulSet row + bound PVC data-db-0.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: fg-demo
  labels: {app: db, app.kubernetes.io/part-of: fleetglass-samples}
spec:
  replicas: 1
  serviceName: db
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db, app.kubernetes.io/part-of: fleetglass-samples}
    spec:
      containers:
        - name: main
          image: nginx:1.27-alpine
          volumeMounts: [{name: data, mountPath: /data}]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {app.kubernetes.io/part-of: fleetglass-samples}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources: {requests: {storage: 16Mi}}
---
# DaemonSet -> one pod per node.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: fg-demo
  labels: {app: node-agent, app.kubernetes.io/part-of: fleetglass-samples}
spec:
  selector:
    matchLabels: {app: node-agent}
  template:
    metadata:
      labels: {app: node-agent, app.kubernetes.io/part-of: fleetglass-samples}
    spec:
      containers:
        - name: main
          image: busybox:1.37
          command: ["sleep", "3600"]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
---
# CronJob every 5 minutes -> CronJob row with a last schedule time.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ticker
  namespace: fg-demo
  labels: {app.kubernetes.io/part-of: fleetglass-samples}
spec:
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels: {app: ticker, app.kubernetes.io/part-of: fleetglass-samples}
        spec:
          restartPolicy: Never
          containers:
            - name: main
              image: busybox:1.37
              command: ["date"]
              resources:
                requests: {cpu: 5m, memory: 8Mi}
---
# Ingress; no ingress controller is installed, but the row still shows.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: fg-demo
  labels: {app: web, app.kubernetes.io/part-of: fleetglass-samples}
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: web, port: {name: http}}
---
# PVC no pod uses -> stays Pending (WaitForFirstConsumer).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scratch
  namespace: fg-demo
  labels: {app.kubernetes.io/part-of: fleetglass-samples}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources: {requests: {storage: 16Mi}}
---
# Never schedulable -> Deployment stays below its desired replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: undersized
  namespace: fg-demo
  labels: {app: undersized, app.kubernetes.io/part-of: fleetglass-samples}
spec:
  replicas: 2
  selector:
    matchLabels: {app: undersized}
  template:
    metadata:
      labels: {app: undersized, app.kubernetes.io/part-of: fleetglass-samples}
    spec:
      nodeSelector: {fleetglass.dev/none: "true"}
      containers:
        - name: main
          image: busybox:1.37
          command: ["sleep", "infinity"]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
