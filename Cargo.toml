[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/TuxoJlumoH/fleetglass"
publish = false

[workspace.dependencies]
fleetglass-core = { path = "crates/core" }

# Kubernetes. kube 5 requires k8s-openapi 0.29; `latest` = v1_37 there.
kube = { version = "5.2.0", default-features = false, features = [
    "client",
    "config",
    "runtime",
    "ws",
    "rustls-tls",
    "ring",
] }
k8s-openapi = { version = "0.29.0", default-features = false, features = ["latest"] }

tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }
thiserror = "2.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
# Global allocator for the app and bench binaries (R-14b). MIT; builds bundled C via `cc`.
mimalloc = { version = "0.1.52", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
