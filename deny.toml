# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`. CI runs it on every PR.

[graph]
all-features = true

[advisories]
# RustSec advisories. Unmaintained crates are reported only for direct dependencies; transitive
# ones (e.g. GTK3 bindings pulled in by Tauri on Linux) are outside our control.
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.9
# Must stay compatible with Apache-2.0 (CONTRIBUTING.md: Apache/MIT/BSD-compatible only).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
